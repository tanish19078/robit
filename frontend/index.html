<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PRAHARI v0.1 — complaint-anchored cash-out forecast [SIMULATION]</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body{font-family:system-ui,sans-serif;margin:0}
header{padding:8px 16px;background:#111;color:#eee}
header h1{font-size:18px;margin:4px 0}
.sim{background:#b71c1c;padding:2px 8px;border-radius:4px;font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px}
#map{height:480px;border:1px solid #ccc}
#tier{font-size:20px;font-weight:bold;padding:8px;border-radius:4px;background:#eee}
#tier.Red{background:#ffcdd2}#tier.Amber{background:#ffe0b2}
#tier.Green{background:#c8e6c9}#tier.Critical{background:#b71c1c;color:#fff}
pre{background:#f5f5f5;padding:8px;margin:0 16px 16px;overflow:auto;max-height:300px}
h2{font-size:14px;margin:12px 0 4px}
#graphSvg{border:1px solid #ccc;background:#fafafa}
table{border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ccc;padding:2px 8px;text-align:right}
td:first-child,th:first-child{text-align:left}
.dim{color:#666;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>PRAHARI <span class="sim">SIMULATION v0.1</span></h1>
  <div class="controls">
    <label>Gateway <input id="gw" value="http://localhost:3000" size="22" /></label>
    <label>Incident
      <select id="incSel"></select>
      <input id="inc" value="INC-2026-00041" size="16" />
    </label>
    <button id="bRefreshInc">⟳ incidents</button>
    <button id="bForecast">Forecast</button>
    <button id="bMetrics">Metrics</button>
    <button id="bFed">Federation demo</button>
  </div>
</header>
<main>
  <section class="left">
    <div id="tier">no forecast yet</div>
    <h2>Money path</h2><div id="path">—</div>
    <h2>Money graph (hop columns, color = mule risk)</h2>
    <svg id="graphSvg" width="100%" height="220"></svg>
    <h2>Mule table (baseline + learned → final)</h2><div id="mules">—</div>
    <h2>Cells</h2><div id="cells">—</div>
    <h2>Evidence</h2><ul id="evidence"><li>—</li></ul>
    <h2>Review (human approval required)</h2>
    <div class="controls">
      <button data-rev="acknowledge">Acknowledge</button>
      <button data-rev="escalate">Escalate</button>
      <button data-rev="dismiss">Dismiss</button>
      <select id="simAction">
        <option value="step_up">step_up</option>
        <option value="hold_request">hold_request</option>
        <option value="patrol_notify">patrol_notify</option>
      </select>
      <button id="bSim">Simulate action</button>
    </div>
    <div id="reviewOut">—</div>
  </section>
  <section class="right">
    <div id="map"></div>
    <h2>Metrics</h2><div id="metrics">—</div>
  </section>
</main>
<h2>Raw</h2><pre id="raw">—</pre>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
