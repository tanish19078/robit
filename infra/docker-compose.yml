services:
  ml-service:
    build: { context: .., dockerfile: ml-service/Dockerfile }
    environment:
      MODEL_VERSION: prahari-0.1-dev
    expose: ["8000"]
  gateway:
    build: { context: .., dockerfile: gateway/Dockerfile }
    environment:
      PORT: 3000
      ML_URL: http://ml-service:8000
      MODEL_VERSION: prahari-0.1-dev
    ports: ["3000:3000"]
    depends_on: [ml-service]
